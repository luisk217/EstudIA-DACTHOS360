# Despliegue del tablero DACTHO 360 en GitHub Pages.
# Publica solo la carpeta web/ (sitio estático) cada vez que se hace push a main.
# Los datos que se publican son los JSON anonimizados de web/data; los archivos fuente
# originales nunca se suben (ver .gitignore).
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Las pruebas de datos web (test_datos_web.py) no requieren los Excel fuente.
      - run: python -m pytest -q tests/test_datos_web.py

  desplegar:
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio (sin carpeta de pruebas)
        run: |
          mkdir _site
          cp -r web/. _site/
          rm -rf _site/tests
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
